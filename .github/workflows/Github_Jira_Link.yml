# This is a basic workflow to help you get started with Actions

name: Demo_CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "feature" branch
  push:
    branches: [ "feature" ]
  pull_request:
    branches: [ "feature" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env: 
   jira_url: "https://dhananjayvd1.atlassian.net"
   jira_username: ${{ secrets.JIRA_USERNAME }}
   jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      - name: Get Commit SHA and Message
        id: commit-info
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "COMMIT_SHA=$COMMIT_SHA"
          COMMIT_MESSAGE=$(git log -1 --pretty=%B $COMMIT_SHA)
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE"
          echo "$jira_url $jira_username" 

      - name: Setup Python
        uses: actions/setup-python@v4
        with: 
           python-version: '3.13'           

      - name: Call Python Script
        id: Python_op
        env:
             jira_url: "https://dhananjayvd1.atlassian.net"
             jira_username: ${{ secrets.JIRA_USERNAME }}
             jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
             commit_msg: $COMMIT_MESSAGE 
        run: |
           python Jira_Verify.py     
          

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
